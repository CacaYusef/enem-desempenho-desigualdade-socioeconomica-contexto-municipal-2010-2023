[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enem-analysis"
version = "0.1.0"
description = "Análise reprodutível de desempenho no ENEM e desigualdade socioeconômica"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.1",
  "matplotlib>=3.9",
  "numpy>=2.1",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "scipy>=1.14",
  "seaborn>=0.13",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.3",
  "pypdf>=6.18",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
